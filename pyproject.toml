[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpilot-api"
version = "0.1.0"
description = "Local development API foundation for FlowPilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "tzdata>=2025.1; sys_platform == 'win32'",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.16,<3", "ruff>=0.11,<1", "build>=1,<2"]
browser = ["playwright>=1.56,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires an isolated PostgreSQL test database",
    "browser: requires Playwright Chromium and FLOWPILOT_BROWSER_TESTS=1",
]

[tool.uv]
link-mode = "copy"

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.setuptools.package-dir]
"" = "services/api/src"

[tool.setuptools.package-data]
flowpilot_api = ["web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
