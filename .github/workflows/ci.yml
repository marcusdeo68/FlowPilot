name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: npx --yes --package pyright@1.1.407 pyright
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -m build
      - run: node --check services/api/src/flowpilot_api/web/app.js
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: flowpilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowpilot -d flowpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLOWPILOT_TEST_DATABASE_URL: postgresql+psycopg://flowpilot:synthetic-ci-only@127.0.0.1:5432/flowpilot_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -q -m postgres
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLOWPILOT_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --extra dev --extra browser
      - run: uv run --no-sync playwright install --with-deps --only-shell chromium
      - run: uv run --no-sync pytest -q -m browser
