name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: read
jobs:
  workspace-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t flowpilot-workspace:ci .
      - run: docker run --rm flowpilot-workspace:ci alembic heads
      - run: docker compose -f compose.hosted-test.yaml up -d --wait --wait-timeout 90
      - run: docker compose -f compose.hosted-test.yaml exec -T workspace python /tmp/hosted_image_smoke.py before-migration
      - run: docker compose -f compose.hosted-test.yaml run --rm -T --no-deps workspace alembic upgrade head
      - run: docker compose -f compose.hosted-test.yaml exec -T workspace python /tmp/hosted_image_smoke.py after-migration
      - if: failure()
        run: docker compose -f compose.hosted-test.yaml logs --no-color
      - if: always()
        run: docker compose -f compose.hosted-test.yaml down
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: npx --yes --package pyright@1.1.407 pyright
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python -m build
      - run: node --check services/api/src/flowpilot_api/web/app.js
      - run: node --check services/api/src/flowpilot_api/web/workspace.js
      - run: node --check services/api/src/flowpilot_api/web/workspace-inbox.js
      - run: node --check services/api/src/flowpilot_api/web/workspace-notes.js
      - run: node --check services/api/src/flowpilot_api/web/workspace-events.js
      - run: node --check services/api/src/flowpilot_api/web/workspace-reminders.js
      - run: node --check services/api/src/flowpilot_api/web/workspace-access.js
      - run: node --check services/api/src/flowpilot_api/web/workspace-invitations.js
      - run: node --check services/api/src/flowpilot_api/web/workspace-sharing.js
      - run: node --test edge/worker.test.mjs
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: flowpilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowpilot -d flowpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLOWPILOT_TEST_DATABASE_URL: postgresql+psycopg://flowpilot:synthetic-ci-only@127.0.0.1:5432/flowpilot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -q -m 'postgres and not browser'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowpilot
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: flowpilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowpilot -d flowpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLOWPILOT_BROWSER_TESTS: '1'
      FLOWPILOT_TEST_DATABASE_URL: postgresql+psycopg://flowpilot:synthetic-ci-only@127.0.0.1:5432/flowpilot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --extra dev --extra browser
      - run: uv run --no-sync playwright install --with-deps --only-shell chromium
      - run: uv run --no-sync pytest -q -m browser
